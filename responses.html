<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Her responses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .responses-page {
      max-width: 430px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2rem;
      min-height: 100dvh;
    }
    .response-item {
      background: rgba(247, 250, 244, 0.9);
      border-radius: 1rem;
      padding: 1rem 1.1rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 4px 14px rgba(30, 61, 42, 0.08);
    }
    .response-item time {
      display: block;
      font-size: 0.8rem;
      color: var(--ink-soft);
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="responses-page">
    <p class="brand">Beautiful</p>
    <h1 class="headline">Her responses</h1>
    <p class="support">Newest first  refresh to update.</p>
    <div id="list"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const list = document.getElementById("list");

    async function load() {
      const { data, error } = await client
        .from("responses")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        list.innerHTML = `<p class="support">Could not load: ${error.message}</p>`;
        return;
      }

      if (!data.length) {
        list.innerHTML = `<p class="support">No responses yet.</p>`;
        return;
      }

      list.innerHTML = data
        .map((row) => {
          const when = new Date(row.created_at).toLocaleString();
          const affirms = (row.affirmations || []).join(" · ") || "—";
          return `<article class="response-item">
            <time>${when}</time>
            <p><strong>See again:</strong> ${row.see_again || "—"}</p>
            <p><strong>Beauty sleep:</strong> ${row.nap_feeling || "—"}</p>
            <p><strong>Affirmations:</strong> ${affirms}</p>
          </article>`;
        })
        .join("");
    }

    load();
  </script>
</body>
</html>
